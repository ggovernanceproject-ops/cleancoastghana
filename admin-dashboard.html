<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - GCCP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #0b2027;
    --ocean: #006D77;
    --ocean-deep: #004e54;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #f4f6f7;
    color: var(--dark);
    padding: 2rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 6px;
    padding: 2rem 2.5rem;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    margin: 0;
  }
  .header-right {
    display: flex;
    gap: 0.8rem;
    align-items: center;
  }
  #user-label { font-size: 0.8rem; color: #999; }
  .logout-btn {
    font-size: 0.78rem;
    padding: 0.5rem 1.2rem;
    border: 1px solid #ddd;
    background: none;
    cursor: pointer;
    border-radius: 3px;
    color: var(--dark);
  }
  .logout-btn:hover { background: #f5f5f5; }
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 2px solid #eee;
    margin-bottom: 1.5rem;
  }
  .dash-tab {
    padding: 0.7rem 1.5rem;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.85rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    color: #999;
    font-family: 'DM Sans', sans-serif;
  }
  .dash-tab.active { border-bottom-color: var(--ocean); color: var(--ocean); font-weight: 600; }
  #dash-content { font-size: 0.85rem; }
  .dash-stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .dash-stat { background: #f8f9fa; border-radius: 4px; padding: 0.9rem 1.3rem; flex: 1; min-width: 150px; }
  .dash-stat span { display: block; font-size: 1.6rem; font-weight: 700; color: var(--ocean); }
  .dash-stat small { font-size: 0.72rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
  .dash-table { width: 100%; border-collapse: collapse; }
  .dash-table th { background: #f5f5f5; padding: 0.65rem 0.9rem; text-align: left; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: #666; }
  .dash-table td { padding: 0.65rem 0.9rem; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .dash-table tr:hover td { background: #fafafa; }
  .badge-paid { background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
  .badge-pending { background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
  .msg-box { color: #c0392b; padding: 1rem; background: #fdf0f0; border-radius: 4px; }
  .msg-box small { display: block; color: #999; margin-top: 0.3rem; }
  .loading { text-align: center; padding: 2.5rem; color: #999; }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="header">
      <h1>Admin Dashboard</h1>
      <div class="header-right">
        <span id="user-label"></span>
        <button class="logout-btn" onclick="adminLogout()">Logout</button>
      </div>
    </div>

    <div class="tabs">
      <button class="dash-tab active" id="tab-donations" onclick="switchTab('donations')">Donations</button>
      <button class="dash-tab" id="tab-investors" onclick="switchTab('investors')">Investor Inquiries</button>
      <button class="dash-tab" id="tab-contacts" onclick="switchTab('contacts')">Contact Messages</button>
    </div>

    <div id="dash-content">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<!-- Firebase SDK — Auth + Firestore READ only. Same project config as the main site. -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg = {
  apiKey: "AIzaSyC9GPU8fUKfTFYUiBwOexpdjqe3vLmAk10",
  authDomain: "ghana-coastline-conservation.firebaseapp.com",
  projectId: "ghana-coastline-conservation",
  storageBucket: "ghana-coastline-conservation.firebasestorage.app",
  messagingSenderId: "835315451838",
  appId: "1:835315451838:web:afb2b34ee7e1671299dbef"
};

try {
  const app = initializeApp(cfg);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window._db = db;
  window._auth = auth;
  window._fbCollection = collection;
  window._fbGetDocs = getDocs;
  window._fbOrderBy = orderBy;
  window._fbQuery = query;
  window._fbLimit = limit;
  window._fbSignOut = signOut;
  window._firebaseReady = true;

  onAuthStateChanged(auth, (u) => {
    if (!u) {
      // Not logged in — bounce back to login page.
      window.location.href = 'admin-login.html';
      return;
    }
    document.getElementById('user-label').textContent = u.email;
    loadTab('donations');
  });

  console.log('%cFirebase ready ✓', 'color:#006D77;font-weight:bold');
} catch (e) {
  console.error('Firebase init failed:', e.message);
  window._firebaseReady = false;
}
</script>

<script>
function esc(v) {
  if (v == null) return '—';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function adminLogout() {
  if (window._fbSignOut && window._auth) await window._fbSignOut(window._auth);
  window.location.href = 'admin-login.html';
}

function switchTab(tab) {
  ['donations', 'investors', 'contacts'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  loadTab(tab);
}

async function loadTab(tab) {
  const ct = document.getElementById('dash-content');
  ct.innerHTML = '<div class="loading">⏳ Loading…</div>';

  if (!window._firebaseReady) {
    ct.innerHTML = '<div class="msg-box"><strong>Firebase not connected.</strong> Check config.</div>';
    return;
  }
  if (!window._auth || !window._auth.currentUser) {
    ct.innerHTML = '<div class="msg-box"><strong>Session expired.</strong> Redirecting to login…</div>';
    setTimeout(() => { window.location.href = 'admin-login.html'; }, 1200);
    return;
  }

  try {
    const collectionMap = { donations: 'donations', investors: 'investor_inquiries', contacts: 'contact_messages' };
    const q = window._fbQuery(
      window._fbCollection(window._db, collectionMap[tab]),
      window._fbOrderBy('createdAt', 'desc'),
      window._fbLimit(200)
    );
    const snap = await window._fbGetDocs(q);
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (tab === 'donations') renderDonations(docs);
    if (tab === 'investors') renderInvestors(docs);
    if (tab === 'contacts') renderContacts(docs);
  } catch (e) {
    ct.innerHTML = `<div class="msg-box"><strong>Error:</strong> ${esc(e.message)}<small>Check Firestore security rules allow authenticated reads.</small></div>`;
  }
}

function renderDonations(docs) {
  const total = docs.reduce((s, d) => s + (parseFloat(d.amount) || 0), 0);
  const paid = docs.filter(d => d.status === 'paid').length;
  document.getElementById('dash-content').innerHTML = `
    <div class="dash-stats">
      <div class="dash-stat"><span>${docs.length}</span><small>Records</small></div>
      <div class="dash-stat"><span>${paid}</span><small>Completed</small></div>
      <div class="dash-stat"><span>${total.toFixed(2)}</span><small>Total Collected</small></div>
    </div>
    ${docs.length === 0 ? '<p style="color:#999;text-align:center;padding:2rem;">No donations yet.</p>' : `
    <div style="overflow-x:auto"><table class="dash-table">
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Amount</th><th>Cur</th><th>Type</th><th>Status</th><th>Ref</th></tr></thead>
      <tbody>${docs.map(d => `<tr>
        <td style="white-space:nowrap">${fmtDate(d.createdAt)}</td>
        <td>${esc(d.donor_name)}</td>
        <td style="color:#666">${esc(d.email)}</td>
        <td><strong>${esc(d.amount)}</strong></td>
        <td>${esc(d.currency)}</td>
        <td style="color:#666;font-size:0.75rem">${esc(d.frequency).replace(' donation', '')}</td>
        <td><span class="${d.status === 'paid' ? 'badge-paid' : 'badge-pending'}">${esc(d.status)}</span></td>
        <td style="font-size:0.68rem;color:#aaa">${esc(d.paystack_ref).substring(0, 22)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`}
  `;
}

function renderInvestors(docs) {
  document.getElementById('dash-content').innerHTML = `
    <div class="dash-stats"><div class="dash-stat"><span>${docs.length}</span><small>Inquiries</small></div></div>
    ${docs.length === 0 ? '<p style="color:#999;text-align:center;padding:2rem;">No inquiries yet.</p>' : `
    <div style="overflow-x:auto"><table class="dash-table">
      <thead><tr><th>Date</th><th>Name</th><th>Organisation</th><th>Email</th><th>Tier</th><th>Message</th></tr></thead>
      <tbody>${docs.map(d => `<tr>
        <td style="white-space:nowrap">${fmtDate(d.createdAt)}</td>
        <td>${esc(d.name)}</td>
        <td>${esc(d.org)}</td>
        <td style="color:#666">${esc(d.email)}</td>
        <td style="font-size:0.75rem">${esc(d.tier)}</td>
        <td style="max-width:200px;color:#666;font-size:0.78rem">${esc(d.message).substring(0, 80)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`}
  `;
}

function renderContacts(docs) {
  document.getElementById('dash-content').innerHTML = `
    <div class="dash-stats"><div class="dash-stat"><span>${docs.length}</span><small>Messages</small></div></div>
    ${docs.length === 0 ? '<p style="color:#999;text-align:center;padding:2rem;">No messages yet.</p>' : `
    <div style="overflow-x:auto"><table class="dash-table">
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th></tr></thead>
      <tbody>${docs.map(d => `<tr>
        <td style="white-space:nowrap">${fmtDate(d.createdAt)}</td>
        <td>${esc(d.name)}</td>
        <td style="color:#666">${esc(d.email)}</td>
        <td>${esc(d.subject)}</td>
        <td style="max-width:260px;color:#666;font-size:0.78rem">${esc(d.message).substring(0, 100)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`}
  `;
}
</script>

</body>
</html>
