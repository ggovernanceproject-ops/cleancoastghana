<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - GCCP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #0b2027;
    --ocean: #006D77;
    --ocean-deep: #004e54;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ocean-deep);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #fff;
    border-radius: 6px;
    max-width: 420px;
    width: 100%;
    padding: 3rem;
  }
  .logo { text-align: center; font-size: 2rem; margin-bottom: 0.5rem; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--dark);
    text-align: center;
    margin-bottom: 0.3rem;
  }
  .sub {
    text-align: center;
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 2rem;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 1.2rem;
  }
  .form-group label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dark);
  }
  .form-group input {
    border: 1.5px solid #e0e0e0;
    border-radius: 3px;
    padding: 0.8rem 1rem;
    font-size: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.3s;
    color: var(--dark);
  }
  .form-group input:focus { border-color: var(--ocean); }
  #admin-error {
    color: #c0392b;
    background: #fdf0f0;
    padding: 0.7rem 0.9rem;
    border-radius: 4px;
    font-size: 0.82rem;
    margin-bottom: 1rem;
    display: none;
  }
  .btn {
    width: 100%;
    background: var(--ocean);
    color: #fff;
    border: none;
    padding: 1rem;
    border-radius: 3px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn:hover { background: var(--ocean-deep); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .footnote {
    text-align: center;
    font-size: 0.78rem;
    color: #999;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🌊</div>
  <h1>GCCP Admin</h1>
  <p class="sub">Ghana Coastline Conservation Program</p>

  <div id="admin-error"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="admin-email" placeholder="admin@gccp.org" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="login-btn" onclick="adminLogin()">Sign In →</button>

  <p class="footnote">Contact your administrator if you need access credentials.</p>
</div>

<!-- Firebase SDK — Auth only. Same project config used by the main site. -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg = {
  apiKey: "AIzaSyC9GPU8fUKfTFYUiBwOexpdjqe3vLmAk10",
  authDomain: "ghana-coastline-conservation.firebaseapp.com",
  projectId: "ghana-coastline-conservation",
  storageBucket: "ghana-coastline-conservation.firebasestorage.app",
  messagingSenderId: "835315451838",
  appId: "1:835315451838:web:afb2b34ee7e1671299dbef"
};

try {
  const app = initializeApp(cfg);
  const auth = getAuth(app);
  window._auth = auth;
  window._fbSignIn = signInWithEmailAndPassword;
  window._firebaseReady = true;

  // If already logged in, skip straight to the dashboard.
  onAuthStateChanged(auth, (u) => {
    if (u) window.location.href = 'admin-dashboard.html';
  });

  console.log('%cFirebase ready ✓', 'color:#006D77;font-weight:bold');
} catch (e) {
  console.error('Firebase init failed:', e.message);
  window._firebaseReady = false;
}
</script>

<script>
function showError(msg) {
  const el = document.getElementById('admin-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('admin-error').style.display = 'none';
}

async function adminLogin() {
  const em = document.getElementById('admin-email').value.trim();
  const pw = document.getElementById('admin-password').value;
  const btn = document.getElementById('login-btn');

  hideError();

  if (!em || !pw) {
    showError('Please enter your email and password.');
    return;
  }
  if (!window._firebaseReady) {
    showError('Firebase not connected. Please refresh and try again.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    await window._fbSignIn(window._auth, em, pw);
    window.location.href = 'admin-dashboard.html';
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Sign In →';
    const msg = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password')
      ? 'Invalid email or password.'
      : e.code === 'auth/too-many-requests'
      ? 'Too many attempts. Try again later.'
      : e.message;
    showError(msg);
  }
}

// Allow Enter key to submit
document.getElementById('admin-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') adminLogin();
});
</script>

</body>
</html>
